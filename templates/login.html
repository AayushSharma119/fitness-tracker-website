{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-circle fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-muted">Enter your details to log in.</p>
            </div>

            <form method="POST" action="/login">
                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                    <label for="floatingEmail">Email address</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-3 mb-3 fw-bold fs-5 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Login
                </button>
            </form>

            <div class="text-center">
                <p class="mb-0 text-muted">Don't have an account? <a href="/register" class="text-primary text-decoration-none fw-semibold">Sign up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
