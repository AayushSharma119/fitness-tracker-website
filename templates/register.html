{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5" style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-success mb-3"></i>
                <h2 class="fw-bold">Create an Account</h2>
                <p class="text-muted">Join FitBuddy today.</p>
            </div>

            <form method="POST" action="/register">
                <div class="form-floating mb-3">
                    <input type="text" name="name" class="form-control" id="floatingName" placeholder="John Doe" required>
                    <label for="floatingName">Full Name</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="email" name="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                    <label for="floatingEmail">Email address</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" name="password" class="form-control" id="floatingPassword" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 mb-3 fw-bold fs-5 shadow-sm">
                    <i class="fa-solid fa-check-circle me-2"></i> Register
                </button>
            </form>

            <div class="text-center">
                <p class="mb-0 text-muted">Already have an account? <a href="/login" class="text-success text-decoration-none fw-semibold">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
