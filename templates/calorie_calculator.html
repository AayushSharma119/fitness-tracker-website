{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center align-items-center mb-5" style="min-height: 70vh;">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="fa-solid fa-calculator fa-3x text-primary mb-3"></i>
                <h2 class="fw-bold">Maintenance Calories</h2>
                <p class="text-muted">Calculate your daily calorie needs.</p>
            </div>

            <form method="POST">
                <div class="row g-3 mb-3">
                    <div class="col-md-6 form-floating">
                        <input type="number" name="age" id="ageInput" class="form-control" placeholder="Age" required>
                        <label for="ageInput" class="ms-2">Age</label>
                    </div>
                    
                    <div class="col-md-6 form-floating">
                        <select name="gender" id="genderInput" class="form-select">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                        <label for="genderInput" class="ms-2">Gender</label>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6 form-floating">
                        <input type="number" step="0.1" name="weight" id="weightInput" class="form-control" placeholder="Weight" required>
                        <label for="weightInput" class="ms-2">Weight (kg)</label>
                    </div>
                    
                    <div class="col-md-6 form-floating">
                        <input type="number" step="0.1" name="height" id="heightInput" class="form-control" placeholder="Height" required>
                        <label for="heightInput" class="ms-2">Height (cm)</label>
                    </div>
                </div>

                <div class="form-floating mb-4">
                    <select name="activity" id="activityInput" class="form-select">
                        <option value="1.2">Sedentary (little or no exercise)</option>
                        <option value="1.375">Light exercise (1‑3 days/week)</option>
                        <option value="1.55">Moderate exercise (3‑5 days/week)</option>
                        <option value="1.725">Heavy exercise (6‑7 days/week)</option>
                    </select>
                    <label for="activityInput" class="ms-2">Activity Level</label>
                </div>

                <button class="btn btn-primary w-100 py-3 fw-bold fs-5 shadow-sm">
                    <i class="fa-solid fa-check-double me-2"></i> Calculate
                </button>
            </form>

            {% if calories %}
            <div class="mt-4 pt-4 border-top">
                <h4 class="fw-bold mb-3 text-center"><i class="fa-solid fa-chart-line text-success me-2"></i>Your Results</h4>
                <div class="d-flex justify-content-between align-items-center p-3 bg-light rounded-3 mb-2">
                    <span class="text-muted fw-semibold">Basal Metabolic Rate (BMR)</span>
                    <span class="fs-5 fw-bold text-dark">{{ bmr }} kcal</span>
                </div>
                <div class="d-flex justify-content-between align-items-center p-3 bg-primary bg-opacity-10 text-primary rounded-3">
                    <span class="fw-semibold">Maintenance Calories</span>
                    <span class="fs-4 fw-bold">{{ calories }} kcal/day</span>
                </div>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
